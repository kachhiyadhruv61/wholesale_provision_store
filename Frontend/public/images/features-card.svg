<svg width="720" height="620" viewBox="0 0 720 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6aa6ff"/>
      <stop offset="100%" stop-color="#4f8df4"/>
    </linearGradient>

    <linearGradient id="iconGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a6cff"/>
      <stop offset="100%" stop-color="#5a7cff"/>
    </linearGradient>

    <filter id="containerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#2d4b9d" flood-opacity="0.18"/>
    </filter>

    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3c4bb2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="620" fill="url(#bgGradient)"/>

  <!-- Subtle grocery pattern (very low opacity) -->
  <g opacity="0.05" fill="white">
    <path d="M70 92 h44 v20 h-44 z"/>
    <path d="M130 80 h26 v26 h-26 z"/>
    <path d="M560 120 h36 v18 h-36 z"/>
    <path d="M610 112 h22 v22 h-22 z"/>
    <path d="M120 480 h36 v18 h-36 z"/>
    <path d="M170 472 h22 v22 h-22 z"/>
    <path d="M520 500 h36 v18 h-36 z"/>
    <path d="M570 492 h22 v22 h-22 z"/>
    <path d="M320 70 h30 v18 h-30 z"/>
    <path d="M360 64 h22 v22 h-22 z"/>
  </g>

  <!-- Main container -->
  <g filter="url(#containerShadow)">
    <rect x="70" y="70" width="580" height="480" rx="32" fill="white"/>
  </g>

  <!-- Dividers -->
  <line x1="120" y1="230" x2="600" y2="230" stroke="#eef1f7" stroke-width="1"/>
  <line x1="120" y1="370" x2="600" y2="370" stroke="#eef1f7" stroke-width="1"/>

  <!-- Row 1: Free Shipping -->
  <g>
    <rect x="120" y="120" width="70" height="70" rx="16" fill="url(#iconGradient)" filter="url(#iconShadow)"/>
    <!-- Truck icon -->
    <g transform="translate(138, 138)" fill="white">
      <rect x="2" y="10" width="24" height="14" rx="3"/>
      <rect x="24" y="14" width="10" height="10" rx="2"/>
      <circle cx="9" cy="28" r="4"/>
      <circle cx="26" cy="28" r="4"/>
    </g>
    <text x="220" y="148" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#1d1f2c">Free Shipping</text>
    <text x="220" y="174" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="#8a93a6">On orders over ₹1000</text>
  </g>

  <!-- Row 2: Bulk Order Support -->
  <g>
    <rect x="120" y="260" width="70" height="70" rx="16" fill="url(#iconGradient)" filter="url(#iconShadow)"/>
    <!-- Boxes icon -->
    <g transform="translate(138, 278)" fill="white">
      <rect x="2" y="2" width="16" height="16" rx="2"/>
      <rect x="18" y="6" width="16" height="16" rx="2"/>
      <rect x="10" y="18" width="16" height="16" rx="2"/>
    </g>
    <text x="220" y="288" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#1d1f2c">Bulk Order Support</text>
    <text x="220" y="314" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="#8a93a6">Special pricing for bulk buyers</text>
  </g>

  <!-- Row 3: Secure Payment -->
  <g>
    <rect x="120" y="400" width="70" height="70" rx="16" fill="url(#iconGradient)" filter="url(#iconShadow)"/>
    <!-- Lock icon -->
    <g transform="translate(144, 416)" fill="white">
      <rect x="6" y="12" width="20" height="22" rx="3"/>
      <path d="M10 12 v-4 c0-6 4-10 10-10 s10 4 10 10 v4" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <circle cx="16" cy="24" r="3" fill="#5a7cff"/>
    </g>
    <text x="220" y="428" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#1d1f2c">Secure Payment</text>
    <text x="220" y="454" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="500" fill="#8a93a6">100% Protected Payments</text>
  </g>
</svg>
